background_opacity 0.76
dynamic_background_opacity no
background_blur 1

foreground #e6dce6
background #0f0b10
cursor #dcc3e4
selection_foreground #f4eaf5
selection_background #4a3a48

color0 #1c161b
color8 #3a2e38

color1 #786878
color9 #907888

color2 #607060
color10 #788878

color3 #888070
color11 #a09880

color4 #506080
color12 #6878a0

color5 #706880
color13 #888098

color6 #506870
color14 #688890

color7 #c8c6c2
color15 #e0deda

font_family JetBrains Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 11.0

window_padding_width 14
window_padding_height 14

cursor_shape underline
force_cursor yes
cursor_blink_interval 0.5
cursor_stop_blinking_after 0

inactive_border_color #1c161b
active_border_color #5e4a5c

tab_bar_edge bottom
tab_bar_style separator
tab_separator "  "
tab_bar_min_tabs 2
active_tab_foreground #dcc3e4
active_tab_background #2a2029
active_tab_font_style bold
inactive_tab_foreground #6e5f6c
inactive_tab_background #0f0b10
inactive_tab_font_style normal
tab_bar_background #0f0b10
tab_title_template " {title} "
tab_bar_margin_height 6.0 0.0
tab_bar_margin_width 8.0

allow_remote_control yes
listen_on unix:/tmp/kitty
mouse_hide_wait 2.0

# Pace rendering to the 165 Hz monitor: the 10 ms default caps kitty at 100 fps.
repaint_delay 5
input_delay 2
sync_to_monitor yes
enable_audio_bell no
update_check_interval 0
close_on_child_death no
inactive_text_alpha 0.35
